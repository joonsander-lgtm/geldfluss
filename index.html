<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geldfluss</title>
<meta name="theme-color" content="#E9E7E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Geldfluss">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E7E2;--card:#FFFFFF;--ink:#1E1F1C;--ink2:#4A4D48;--mute:#8B8E88;--line:#EEEDE9;--line2:#E2E1DC;
  --sage:#5C7D69;--sage-deep:#46634F;--sage-hi:#7E9C88;--sage-soft:#E4ECE6;--sand-soft:#F2EADB;--sand:#C8A970;
  --char:#262825;--red:#C0504D;--red-soft:#F7E2E0;--amber:#B07F22;--amber-soft:#F5EAD3;--gray:#B9BEB7;
  --grad:linear-gradient(135deg,#7A9984 0%,#56765F 100%);
  --font:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--paper:#141513;--card:#1D1F1C;--ink:#ECEDE9;--ink2:#C3C6C0;--mute:#8E928B;--line:#272A26;--line2:#30332E;
  --sage:#86A892;--sage-deep:#6C8E78;--sage-hi:#A3C0AC;--sage-soft:#22302A;--sand-soft:#2E2A20;--sand:#CDB07A;
  --char:#E4E6E1;--red:#E57A76;--red-soft:#3A1F1E;--amber:#DDAE55;--amber-soft:#332914;--gray:#5D625B;
  --grad:linear-gradient(135deg,#6E8F7A 0%,#4A6853 100%);color-scheme:dark}
}
:root[data-theme=dark]{--paper:#141513;--card:#1D1F1C;--ink:#ECEDE9;--ink2:#C3C6C0;--mute:#8E928B;--line:#272A26;--line2:#30332E;
  --sage:#86A892;--sage-deep:#6C8E78;--sage-hi:#A3C0AC;--sage-soft:#22302A;--sand-soft:#2E2A20;--sand:#CDB07A;
  --char:#E4E6E1;--red:#E57A76;--red-soft:#3A1F1E;--amber:#DDAE55;--amber-soft:#332914;--gray:#5D625B;
  --grad:linear-gradient(135deg,#6E8F7A 0%,#4A6853 100%);color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2.5px solid var(--sage);outline-offset:2px;border-radius:12px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--sage-deep)} .neg{color:var(--red)} .warn{color:var(--amber)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .pos{color:var(--sage-hi)}}:root[data-theme=dark] .pos{color:var(--sage-hi)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.015em}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* Gerüst */
.app{max-width:1320px;margin:0 auto;padding:26px 28px 60px}
.content{min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 26px;flex-wrap:wrap}
.ttl{display:flex;align-items:center;gap:14px}
.top h1{font-size:28px;font-weight:600}
.top p{margin:3px 0 0;color:var(--ink2);font-size:15px}
.topnav{display:flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:6px}
.topnav button{display:flex;align-items:center;gap:8px;border-radius:999px;padding:10px 16px;font-weight:600;font-size:14.5px;color:var(--ink2)}
.topnav button:hover{background:var(--line)}
.topnav button.on{background:var(--char);color:var(--card)}
.topnav button.act{color:var(--ink)}
.topnav button.icon{padding:10px 12px}
.topnav .sep{width:1px;height:26px;background:var(--line2);margin:0 4px}

/* Karten & Bausteine */
.card{background:var(--card);border-radius:var(--r-lg);padding:20px 22px}
.card h3{font-size:19px}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.chead .sub{color:var(--mute);font-size:13px;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:4px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.ok,.badge.in{background:var(--sage-soft);color:var(--sage-deep)} .badge.eng{background:var(--amber-soft);color:var(--amber)} .badge.minus,.badge.out{background:var(--red-soft);color:var(--red)}
.badge.neutral{background:var(--line);color:var(--ink2)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .badge.ok,:root:not([data-theme=light]) .badge.in{color:var(--sage-hi)}}:root[data-theme=dark] .badge.ok,:root[data-theme=dark] .badge.in{color:var(--sage-hi)}
.ok-ico{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--sage);color:#fff;font-size:10px}
.icirc{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:0 0 48px}
.icirc.sage{background:var(--sage-soft);color:var(--sage-deep)} .icirc.sand{background:var(--sand-soft);color:#9A7A3E} .icirc.gray{background:var(--line);color:var(--ink2)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .icirc.sage{color:var(--sage-hi)}:root:not([data-theme=light]) .icirc.sand{color:var(--sand)}}:root[data-theme=dark] .icirc.sage{color:var(--sage-hi)}:root[data-theme=dark] .icirc.sand{color:var(--sand)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--grad);color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.btn.soft{background:var(--sage-soft);color:var(--sage-deep);box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.soft{color:var(--sage-hi)}}:root[data-theme=dark] .btn.soft{color:var(--sage-hi)}
.note{font-size:13.5px;color:var(--mute);margin:14px 4px 0;line-height:1.5}

/* Kennzahlen-Reihe */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stats .stat:not(.hi){padding:16px}
.stat{background:var(--card);border-radius:var(--r-lg);padding:18px 20px;display:flex;align-items:center;gap:14px;min-height:92px}
.stat .lbl{color:var(--ink2);font-size:14px}
.stat .val{font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .tiny{font-size:12.5px;color:var(--mute);margin-top:2px}
.stat.hi{background:var(--grad);color:#fff;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.stat.hi .lbl{color:rgba(255,255,255,.85)}
.stat.hi .val{font-size:28px}
.stat.hi .tiny{color:rgba(255,255,255,.78)}
.stat.hi.eng{background:linear-gradient(135deg,#C49A45,#9C7424)} .stat.hi.minus{background:linear-gradient(135deg,#C9625E,#A1403D)}

/* Monatsleiste */
.strip{overflow-x:auto;scrollbar-width:none;margin:0 0 18px;background:var(--card);border-radius:var(--r-lg);padding:14px 14px 12px}
.strip::-webkit-scrollbar{display:none}
.srows{display:flex;flex-direction:column;gap:6px;width:max-content}
.srow{display:flex;gap:6px}
.slabel{position:sticky;left:0;z-index:2;background:var(--card);flex:0 0 92px;width:92px;display:flex;flex-direction:column;justify-content:center;font-weight:600;font-size:14px;padding:0 8px 0 4px}
.slabel small{font-weight:400;font-size:12px;color:var(--mute);line-height:1.2}
.mchip,.pchip{flex:0 0 100px;width:100px;border-radius:14px;padding:8px 12px;text-align:left}
.mchip span,.pchip span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);font-weight:500}
.mchip strong,.pchip strong{display:block;font-size:15.5px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.mchip{background:var(--paper)}
.pchip{background:transparent;border:1.5px dashed var(--line2)}
.mchip:hover,.pchip:hover{outline:1.5px solid var(--line2)}
.mchip.on{background:var(--grad);color:#fff}
.mchip.on span{color:rgba(255,255,255,.85)}
.mchip.on .dot{box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.pchip.on{border:1.5px solid var(--sage);background:var(--sage-soft)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px}
.dot.ok{background:var(--sage)} .dot.eng{background:var(--amber)} .dot.minus{background:var(--red)}

/* Monatskopf */
.mhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:6px 2px 16px}
.mhead h2{font-size:28px}
.mswitch{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px}
.mswitch > button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--paper)}
.mswitch > button:hover:not(:disabled){background:var(--char);color:var(--card)}
.mswitch > button:disabled{opacity:.35;cursor:default}
.mpick{position:relative;display:block;padding:0 10px;cursor:pointer}
.mpick select{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;font-size:16px}
.mpick h2{font-size:24px;white-space:nowrap}
.mpick .caret{font-size:13px;color:var(--mute);margin-left:8px;vertical-align:3px}
.mpick:focus-within{outline:2.5px solid var(--sage);outline-offset:2px;border-radius:12px}
.mpos{margin-left:auto;color:var(--mute);font-size:13.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mnav{display:flex;gap:8px;margin-left:auto}
.mnav button{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:18px}
.mnav button:disabled{opacity:.4;cursor:default}

/* Listen */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.rows{margin:0 -8px}
.item{display:flex;align-items:center;gap:12px;padding:11px 8px;width:100%;text-align:left;border-radius:14px;min-height:58px}
button.item:hover,div.item[data-ex]:hover,summary.item:hover{background:var(--line)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.item .t small{display:block;color:var(--mute);font-size:12.5px;margin-top:1px}
.bar{width:4px;align-self:stretch;border-radius:4px;flex:0 0 4px;margin:3px 2px}
.bar.in{background:var(--sage)} .bar.out{background:var(--char)} .bar.tax{background:var(--gray)} .bar.sal{background:var(--sand)}
.paid{width:30px;height:30px;border-radius:50%;border:1.8px dashed var(--gray);flex:0 0 30px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.paid.on{background:var(--sage);border:1.8px solid var(--sage)}
details > summary{list-style:none;cursor:pointer}
details > summary::-webkit-details-marker{display:none}
.chev{display:inline-block;color:var(--mute);margin-left:4px;transition:transform .2s}
details[open] .chev{transform:rotate(90deg)}
.subl{margin:0 0 4px 26px;border-left:1.5px solid var(--line2);padding-left:6px}
.subl .item{min-height:42px;padding:7px 8px}
.cfoot{display:flex;justify-content:flex-start;margin-top:12px}
.empty-row{color:var(--mute);font-size:14px;padding:10px 8px}

/* Fix */
.fgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:18px;align-items:start}
.fleft{position:sticky;top:28px;display:flex;flex-direction:column;gap:18px}
.statement{font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1.15;margin:2px 0 8px}
.lead{color:var(--ink2);font-size:15.5px;margin:0}
.gauge{display:flex;align-items:center;gap:18px;margin-top:16px}
.gauge svg{flex:0 0 auto}
.gauge .gt{font-size:13.5px;color:var(--ink2);line-height:1.45}
.ribbon{display:flex;height:16px;border-radius:999px;overflow:hidden;gap:3px;margin:16px 0 12px}
.ribbon div{min-width:5px}
.legendlist{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px;font-size:13.5px}
.legendlist div{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.legendlist i{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.legendlist b{margin-left:auto;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.bill .ln{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:15px}
.bill .ln > span:first-child{color:var(--ink2)}
.bill .ln b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bill small{display:block;color:var(--mute);font-size:12.5px;font-weight:400}
.bill .mid{border-top:1px solid var(--line2);margin-top:4px;padding-top:11px}
.bill .mid > span:first-child,.bill .end > span:first-child{color:var(--ink);font-weight:600}
.bill .end{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:12px;align-items:center}
.bill .end b{font-size:22px}
.fright{display:flex;flex-direction:column;gap:18px}

/* Überblick */
.ostat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px}
.headline{margin:0 2px 18px}
.headline h2{font-size:28px;line-height:1.2}
.headline p{color:var(--ink2);margin:6px 0 0;max-width:62ch}
.cgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px}
.chart{position:relative}
.chart p{margin:-6px 0 12px;color:var(--mute);font-size:13.5px}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 8px;font-size:12.5px;color:var(--ink2)}
.keys i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.keys i.dash{width:14px;height:0;border-top:2px dashed var(--mute);border-radius:0;vertical-align:3px}
svg text{font-family:var(--font);font-size:11.5px;fill:var(--mute)}
.tip{position:absolute;pointer-events:none;background:var(--char);color:var(--card);border-radius:10px;padding:8px 11px;font-size:12.5px;white-space:nowrap;display:none;z-index:3;line-height:1.5}
.tip b{font-weight:600}

.empty{max-width:560px}
.empty h3{font-size:24px;margin-bottom:8px}
.empty p{color:var(--ink2);margin:0 0 16px}

/* Sheets */
.backdrop{position:fixed;inset:0;background:rgba(20,22,19,.38);display:none;z-index:40;align-items:flex-end;justify-content:center}
.backdrop.on{display:flex}
.sheet{background:var(--paper);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 20px 30px;animation:up .22s ease-out}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.chev{transition:none}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.sh h3{font-size:21px}
.sh button{font-size:14px;font-weight:600;color:var(--mute);background:var(--card);border-radius:999px;padding:7px 14px}
.f{margin:0 0 14px}
.f > label{display:block;font-weight:600;font-size:14px;margin:0 2px 6px}
.f input[type=text],.f select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;appearance:none;-webkit-appearance:none}
.f input[type=text]:focus,.f select:focus{border-color:var(--sage);outline:none}
.f select{background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat}
.money{position:relative}
.money input{font-size:26px!important;font-weight:600;padding-right:44px!important;font-variant-numeric:tabular-nums}
.money::after{content:"€";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px}
@media(max-width:520px){.three{grid-template-columns:1fr 1fr}.three .f:first-child{grid-column:1/-1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px}
.chips button.on{background:var(--char);color:var(--card)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 14px;cursor:pointer}
.sw span{font-weight:600}
.sw small{display:block;font-weight:400;color:var(--mute);font-size:13px}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:999px;background:var(--line2);position:relative;flex:0 0 48px;cursor:pointer;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked{background:var(--sage)}
.sw input:checked::after{transform:translateX(20px)}
.calc{background:var(--sage-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;margin:0 0 16px}
.calc b{font-weight:700}
.save{width:100%;background:var(--grad);color:#fff;border-radius:14px;padding:15px;font-weight:600;font-size:16px;margin-top:4px}
.del{width:100%;color:var(--red);padding:14px;font-weight:600;margin-top:6px}
.hint{font-size:13px;color:var(--mute);margin:-6px 2px 14px;line-height:1.5}
.aside{background:var(--card);border-radius:14px;padding:12px 14px;margin:0 0 14px}
.aside summary{list-style:none;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
.aside summary::-webkit-details-marker{display:none}
.aside .tiny{font-weight:400;color:var(--mute);font-size:13px}
.aside[open] .chev{transform:rotate(90deg)}
.aside .f input{background:var(--paper)!important}
.split{border-left:3px solid var(--line2);padding-left:14px;margin-left:4px}
.ghost{background:var(--card);border-radius:12px;font-weight:600;font-size:14px}

/* Responsiv */
@media(max-width:1100px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .stat.hi{grid-column:1/-1}.cgrid{grid-template-columns:1fr}}
@media(max-width:900px){
  .app{padding:16px 14px 60px}
  .top{margin-bottom:18px}
  .top h1{font-size:23px}.top p{font-size:13.5px}.ttl .logo{width:38px;height:38px}
  .topnav{width:100%;justify-content:space-between}
  .topnav button{padding:9px 12px}
  .cols,.fgrid,.ostat{grid-template-columns:1fr}
  .fleft{position:static}
  .stats{gap:10px}.stat{padding:14px;min-height:80px;gap:10px}.stat .val{font-size:20px}.stat.hi .val{font-size:24px}.icirc{width:40px;height:40px;flex-basis:40px}
  .statement{font-size:25px}.headline h2{font-size:24px}.mpick h2{font-size:20px}.mpos{display:none}
}
@media(max-width:620px){.topnav button span{display:none}.topnav button.on span{display:inline}.topnav button{padding:10px 12px}}

/* v3 */
.banner{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--amber-soft);border-radius:var(--r-lg);padding:14px 18px;margin:0 0 18px}
.banner p{margin:0;color:var(--ink);max-width:70ch}
.banner b{font-weight:600}
.tag{display:inline-block;font-size:11.5px;font-weight:600;border:1.3px dashed var(--mute);color:var(--mute);border-radius:999px;padding:0 7px;margin-left:7px;vertical-align:2px}
.bar.plan{background:repeating-linear-gradient(180deg,var(--mute) 0 4px,transparent 4px 7px)}
.item.planned .t b,.item.planned .badge{opacity:.7}

.cmp{display:grid;gap:7px;margin:2px 0 12px;background:var(--paper);border-radius:14px;padding:12px 14px}
.cmp div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14.5px;flex-wrap:wrap}
.cmp span{color:var(--ink2)}

.delta{margin-top:10px;padding-top:10px;border-top:1px solid var(--line2);font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:10px 12px;margin:0 0 6px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--sage);flex:0 0 20px;margin:0}
.chk span{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.chk small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.chk b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.roll{background:var(--card);border-radius:12px;padding:10px 12px;margin:0 0 6px}
.roll .top{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px}
.roll .top b{font-weight:600}
.roll .top small{color:var(--mute)}
.roll .chips{gap:6px}
.roll .chips button{padding:6px 11px;font-size:13px;background:var(--paper)}

.stat.hi .tiny.cover{font-weight:500;color:#fff;opacity:.92}
.goal{margin:-4px 2px 12px;font-size:14px;color:var(--ink2)}
.goal b{font-weight:600;color:var(--ink)}
button.stat{font:inherit;color:inherit;cursor:pointer}button.stat:hover{outline:1.5px solid var(--line2)}
.cgrid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:stretch}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.pitem{display:flex;align-items:flex-start;gap:12px;padding:12px 8px;border-radius:14px;cursor:pointer}
.pitem:hover{background:var(--line)}

.tg{display:inline-flex;padding-top:1px;cursor:pointer;position:relative}

<script>
var SyncRef=null; // wird unten gesetzt, wenn Sync eingerichtet ist
/* ============ Grundlagen ============ */
const KEY='geldfluss.v5', VAT=0.19;
const MN=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MNL=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const e0=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const e2=new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
const eur=v=>e0.format(Math.round(v)===0?0:v);
const eurX=v=>Math.abs(v-Math.round(v))>0.004?e2.format(v):e0.format(v);
// Versteht deutsche und englische Schreibweise: 1.212 / 1.212,50 / 1212,5 / 1212.5
const parseNum=x=>{x=String(x??'').trim().replace(/[\s€]/g,'');if(x==='')return 0;if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(x))x=x.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(x)&&!/^-?\d+,\d{1,2}$/.test(x))x=x.replace(/,/g,'');else x=x.replace(',','.');const v=+x;return isFinite(v)?v:0;};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const mIdx=m=>(+m.slice(0,4))*12+(+m.slice(5,7))-1;
const mStr=i=>Math.floor(i/12)+'-'+pad(i%12+1);
const nowM=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const mLong=m=>MNL[mIdx(m)%12]+' '+m.slice(0,4);
const mName=m=>MNL[mIdx(m)%12];
const mShort=m=>MN[mIdx(m)%12]+" '"+m.slice(2,4);
const mMid=m=>MN[mIdx(m)%12]+' '+m.slice(0,4);
const fmtDate=d=>d?(+d.slice(8,10))+'.'+(+d.slice(5,7))+'.':'';
const sum=l=>l.reduce((a,o)=>a+(+o.amount||0),0);
const oftenTxt={1:'monatlich',3:'alle 3 Monate',6:'alle 6 Monate',12:'jährlich'};

/* ============ Daten ============ */
function blank(){return {v:5,settings:{salary:1000,taxRate:20,vatOn:true,polster:null,horizon:12,theme:'auto',dispo:0,safeMonths:6},
  start:{month:null,asOf:null,main:0,free:0,ust:null,est:null,tax:0,done:[],orig:[],salPaid:0},salaryByMonth:{},fixed:[],extras:[],paidFixed:{}};}
function fromV2(o){
  const st=o.settings||{}, N=blank(); N.v=4;
  Object.assign(N.settings,{salary:+st.salary||1000,taxRate:+st.taxRate||20,horizon:+st.horizon||12});
  N.start={month:st.startMonth||nowM(),free:+st.startFree||0,tax:+st.startTax||0,est:+st.startTax||null,done:[]};
  N.salaryByMonth=Object.assign({},o.salaryByMonth||{});
  N.fixed=(o.fixed||[]).map(f=>({id:f.id||uid(),name:f.name,amount:+f.amount,kind:f.kind,cat:f.kind==='in'?'biz':(f.sphere==='priv'?'priv':'biz'),vat:!!f.vat,interval:+f.interval||1,start:f.start||N.start.month,end:f.end||''}));
  N.extras=(o.extras||[]).map(x=>({id:x.id||uid(),name:x.name,amount:+x.amount,kind:x.kind,cat:x.kind==='in'?'job':(x.type||'priv'),vat:!!x.vat,month:x.month||N.start.month,paid:!!x.paid}));
  return N;
}
function fromV3(o){
  const st=o.settings||{}, N=blank(), sd=(o.sync&&o.sync.date)||(nowM()+'-01'), m=sd.slice(0,7), day=+sd.slice(8,10); N.v=4;
  Object.assign(N.settings,{salary:+st.lebensgeld||1000,taxRate:+st.taxRate||20,horizon:+st.horizon||12});
  N.start={month:m,free:+(o.sync&&o.sync.free)||0,tax:+(o.sync&&o.sync.est)||0,est:+(o.sync&&o.sync.est)||null,done:[]};
  N.salaryByMonth=Object.assign({},o.lebenByMonth||{});
  for(const f of o.fixed||[]){
    N.fixed.push({id:f.id||uid(),name:f.name,amount:+f.amount,kind:f.kind,cat:f.kind==='in'?'biz':(f.acct==='priv'?'priv':'biz'),vat:!!f.vat,interval:+f.interval||1,start:f.start||m,end:f.end||''});
    const oc=(o.occ||{})[f.id+'|'+m]; if((+f.day||1)<day&&!(oc&&oc.open)) N.start.done.push(f.id+'|'+m);
  }
  for(const x of o.items||[]){
    if(x.kind==='in'&&x.status==='angebot') continue;
    N.extras.push({id:x.id||uid(),name:x.name,amount:+x.amount,kind:x.kind,cat:x.kind==='in'?'job':(x.type||'priv'),vat:!!x.vat,month:(x.date||sd).slice(0,7),paid:x.kind==='in'?x.status==='bezahlt':!!x.done});
  }
  return N;
}
// v4 → v5: Privatkonto bleibt draußen, Haken und „im Kontostand" werden angeglichen
function fromV4(o){
  const N=Object.assign(blank(),JSON.parse(JSON.stringify(o))); N.v=5;
  const st=N.start=Object.assign(blank().start,N.start||{});
  if(st.main!=null&&st.main!=='') st.free=+st.main;
  st.done=Array.isArray(st.done)?st.done:[]; st.orig=st.done.slice(); st.salPaid=0;
  N.paidFixed=N.paidFixed||{};
  for(const k of st.done){ if(k.startsWith('x:')){const x=(N.extras||[]).find(y=>'x:'+y.id===k); if(x) x.paid=true;} else N.paidFixed[k]=true; }
  return N;
}
function importData(d){
  if(d.v===5) return d;
  if(d.v===4) return fromV4(d);
  if(d.v===3) return fromV4(fromV3(d));
  if(d.settings&&d.fixed&&d.extras) return fromV4(fromV2(d));
  throw new Error('kein Backup');
}
function load(){
  try{
    const a=localStorage.getItem(KEY); if(a) return JSON.parse(a);
    for(const k of ['geldfluss.v4','geldfluss.v3','geldfluss.v2']){const b=localStorage.getItem(k); if(b){const d=JSON.parse(b); if(k==='geldfluss.v3')d.v=3; return importData(d);}}
  }catch(e){}
  return blank();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S,(k,v)=>k==='_open'?undefined:v))}catch(e){} if(SyncRef) SyncRef.changed();}
let S=load();
function normalize(){
  const b=blank(); S.v=5;
  S.settings=Object.assign(b.settings,S.settings||{}); S.start=Object.assign(b.start,S.start||{});
  ['done','orig'].forEach(k=>{if(!Array.isArray(S.start[k]))S.start[k]=[]});
  ['fixed','extras'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
  if(!S.salaryByMonth)S.salaryByMonth={}; if(!S.paidFixed)S.paidFixed={};
  const p=S.settings.polster; S.settings.polster=(p===''||p==null||!isFinite(+p))?null:+p;
  S.start.salPaid=+S.start.salPaid||0;
}
normalize();
function applyTheme(t){const r=document.documentElement;if(t==='light'||t==='dark')r.dataset.theme=t;else delete r.dataset.theme;}
applyTheme(S.settings.theme);

/* ============ Rechnen ============ */
let PLAN=false; // geplante Posten mitrechnen?
const live=o=>!o.plan||(PLAN&&o.on!==false);
const rateOf=()=>(+S.settings.taxRate||0)/100;
const months=h=>{const i=mIdx(S.start.month);return Array.from({length:h||+S.settings.horizon||12},(_,k)=>mStr(i+k));};
const isOn=(f,m)=>{const i=mIdx(m),s=mIdx(f.start||S.start.month);if(i<s)return false;if(f.end&&i>mIdx(f.end))return false;return (i-s)%(+f.interval||1)===0;};
const isActive=(f,m)=>{const i=mIdx(m),s=mIdx(f.start||S.start.month);return i>=s&&!(f.end&&i>mIdx(f.end));};
const netOf=(a,vat)=>S.settings.vatOn&&vat?a/(1+VAT):a;
const salaryOf=(m,u,flat)=>{if(u!=null&&(flat||S.salaryByMonth[m]==null))return u;return +(S.salaryByMonth[m]??S.settings.salary);};
const fixedIn=m=>S.fixed.filter(f=>live(f)&&isOn(f,m));
const extrasIn=m=>S.extras.filter(x=>live(x)&&x.month===m);
const keyF=(f,m)=>f.id+'|'+m, keyX=x=>'x:'+x.id;
// Steckt dieser Posten schon im eingetragenen Kontostand? (nur im Startmonat)
const inBalance=(key,m)=>m===S.start.month&&S.start.done.includes(key);

function calc(m){
  const rate=rateOf();
  // all = ganzer Monat, c = was ab dem Kontostand noch aufs Konto wirkt
  const c={fixIn:0,jobs:0,bizOut:0,invest:0,priv:0,bizNet:0,taxPaid:0}, all={inc:0,bizNet:0,out:0};
  for(const f of fixedIn(m)){const a=+f.amount, done=inBalance(keyF(f,m),m);
    if(f.kind==='in'){all.inc+=a; if(!done) c.fixIn+=a;}
    else if(f.cat==='priv'){all.out+=a; if(!done) c.priv+=a;}
    else {const n=netOf(a,f.vat); all.bizNet+=n; all.out+=a; if(!done){c.bizOut+=a;c.bizNet+=n;}}}
  for(const x of extrasIn(m)){const a=+x.amount, done=inBalance(keyX(x),m);
    if(x.kind==='in'){all.inc+=a; if(!done) c.jobs+=a;}
    else if(x.cat==='tax'){if(!done) c.taxPaid+=a;}
    else if(x.cat==='priv'){all.out+=a; if(!done) c.priv+=a;}
    else if(x.cat==='invest'){all.out+=a; if(!done) c.invest+=a;}
    else {const n=netOf(a,x.vat); all.bizNet+=n; all.out+=a; if(!done){c.bizOut+=a;c.bizNet+=n;}}}
  c.profit=all.inc-all.bizNet; c.incAll=all.inc; c.outAll=all.out;
  c.taxRes=Math.max(0,rate*(c.fixIn+c.jobs-c.bizNet)); // Rücklage für das, was noch kommt
  c.taxAll=Math.max(0,rate*c.profit);
  return c;
}
function polster(){
  if(S.settings.polster!=null) return +S.settings.polster;
  const m=mStr(mIdx(S.start.month)+1);
  return Math.round(S.fixed.filter(f=>live(f)&&f.kind==='out'&&isActive(f,m)).reduce((a,f)=>a+f.amount/(+f.interval||1),0)/10)*10;
}
function simulate(u=null,flat=false,h=null){
  let bal=+S.start.free||0, pot=(S.start.est==null||S.start.est==='')?0:+S.start.est;
  const pol=polster(), dsp=+S.settings.dispo||0;
  return months(h).map(m=>{
    const c=calc(m), before=bal; pot+=c.taxRes;
    const fromPot=Math.min(pot,c.taxPaid); pot-=fromPot; const taxOver=c.taxPaid-fromPot;
    const sal=salaryOf(m,u,flat), salOut=m===S.start.month?Math.max(0,sal-S.start.salPaid):sal;
    const rein=c.fixIn+c.jobs, raus=c.bizOut+c.invest+c.priv+c.taxRes+taxOver+salOut;
    bal=before+rein-raus;
    const result=c.incAll-c.outAll-c.taxAll-sal-taxOver; // alles rein minus alles raus, ganzer Monat
    return {m,c,before,rein,raus,sal,salOut,taxOver,result,end:bal,pot,status:bal<0?'minus':bal<pol?'eng':'ok',overDispo:bal<-dsp};
  });
}
// So viel Gehalt geht in Monat k, ohne dass in den nächsten N Monaten ein Monatsende unter das Polster fällt.
function salaryRoom(rows){
  const N=Math.max(1,+S.settings.safeMonths||6), pol=polster();
  return rows.map((r,k)=>{let mn=Infinity; for(let j=k;j<Math.min(rows.length,k+N);j++) mn=Math.min(mn,rows[j].end); return Math.max(0,r.sal+mn-pol);});
}
// Jeden Monat gleich viel Gehalt, ohne dass das Polster in den nächsten N Monaten reißt
function maxSalary(){
  const pol=polster(), N=Math.max(1,+S.settings.safeMonths||6), ok=u=>simulate(u,true,Math.max(N,1)).every(r=>r.end>=pol);
  if(!ok(0)) return 0; let lo=0,hi=20000; while(hi-lo>5){const mid=(lo+hi)/2; ok(mid)?lo=mid:hi=mid;} return Math.floor(lo/10)*10;
}
// Bis wann reicht das Geld, mit den eingetragenen Jobs, ohne neue? (bis 5 Jahre)
function runway(){const R=simulate(null,false,60), k=R.findIndex(r=>r.end<0); return k<0?{k:60,m:null}:{k,m:R[k].m};}
const runTxt=r=>r.k===0?'jetzt im Minus':r.m==null?'über 5 Jahre':mMid(mStr(mIdx(r.m)-1));
const metrics=()=>({sal:maxSalary(),run:runway()});
// Rechnet mit einer vorübergehend geänderten Liste und stellt danach alles wieder her
function tryWith(mut){const F=S.fixed,X=S.extras; S.fixed=F.map(o=>({...o})); S.extras=X.map(o=>({...o})); let r; try{mut(); r=metrics();}finally{S.fixed=F; S.extras=X;} return r;}
function withPlan(){PLAN=true; try{return metrics();}finally{PLAN=false;}}
// Der feste Monat: nur Fixposten, ohne Extra-Jobs
function fixMonth(){
  const rate=rateOf(), m=mStr(mIdx(S.start.month)+1);
  const r={inc:0,biz:0,bizNet:0,priv:0};
  for(const f of S.fixed.filter(f=>live(f)&&isActive(f,m))){const a=f.amount/(+f.interval||1);
    if(f.kind==='in') r.inc+=a; else if(f.cat==='priv') r.priv+=a; else {r.biz+=a; r.bizNet+=netOf(a,f.vat);}}
  r.profit=r.inc-r.biz; r.tax=Math.max(0,rate*(r.inc-r.bizNet)); r.salary=+(S.salaryByMonth[m]??S.settings.salary);
  r.rest=r.profit-r.tax-r.priv-r.salary; r.need=r.rest<0?-r.rest/((1-rate)||1):0; r.m=m;
  return r;
}
// Haken setzen. Im Startmonat zählt: Was beim Eintragen abgehakt war, steckt im Kontostand.
function setPaid(key,on,m){
  if(key.startsWith('x:')){const x=S.extras.find(y=>keyX(y)===key); if(x) x.paid=on;}
  else {if(on) S.paidFixed[key]=true; else delete S.paidFixed[key];}
  if(m===S.start.month){const d=S.start.done, i=d.indexOf(key);
    if(!on&&i>=0) d.splice(i,1);                                   // doch noch offen → zählt wieder als „kommt noch"
    if(on&&i<0&&S.start.orig.includes(key)) d.push(key);}          // versehentlich weggeklickt → zurück
}
// Was müsste laut Haken jetzt auf dem Konto sein?
function expectedNow(){
  const m=S.start.month, rate=rateOf(), st=S.start; let v=+st.free||0;
  for(const f of fixedIn(m)){const k=keyF(f,m); if(S.paidFixed[k]&&!st.done.includes(k)) v+=f.kind==='in'?f.amount*(1-rate):-f.amount;}
  for(const x of extrasIn(m)){const k=keyX(x); if(x.paid&&!st.done.includes(k)){ if(x.kind==='in') v+=x.amount*(1-rate); else if(x.cat!=='tax') v-=x.amount; }}
  return v;
}

// Rechnet mit einer bestimmten Auswahl der geplanten Posten
function planMetrics(sel){

  PLAN=true;
  try{P.forEach(o=>o.on=!!sel(o)); return {sal:maxSalary(),run:runway(),need:fixMonth().need};}
  finally{PLAN=false; P.forEach((o,i)=>o.on=keep[i]);}

// Höchste neue Monatskosten ab nächstem Monat, bei denen dein eingestelltes Gehalt N Monate hält
function roomFixed(cat){
  const N=Math.max(1,+S.settings.safeMonths||6), st=mStr(mIdx(S.start.month)+1);
  const ok=c=>{const F=S.fixed; S.fixed=[...F,{id:'_t',name:'',amount:c,kind:'out',cat,vat:cat==='biz',interval:1,start:st,end:'',plan:true,on:true}];
    try{const pol=polster(); return simulate(null,false,N).every(r=>r.end>=pol);}finally{S.fixed=F;}};
  PLAN=true;
  try{if(!ok(0)) return 0; let lo=0,hi=20000; while(hi-lo>5){const m=(lo+hi)/2; ok(m)?lo=m:hi=m;} return Math.floor(lo/10)*10;}
  finally{PLAN=false;}
}
// Höchste einmalige Ausgabe jetzt, ohne dass das Polster in N Monaten reißt
function roomOnce(){
  const N=Math.max(1,+S.settings.safeMonths||6); PLAN=true;
  try{const pol=polster(), mn=Math.min(...simulate(null,false,N).map(r=>r.end)); return Math.max(0,Math.floor((mn-pol)/10)*10);}
  finally{PLAN=false;}
}
function itemEffect(o,t,base){
  const rate=rateOf(), m=planMetrics(x=>x===o), ds=m.sal-base.sal, parts=[];
  parts.push(`Gehalt möglich <b class="${ds<0?'neg':''}">${sg(ds)}</b>`);
  const dk=(base.run.m==null&&m.run.m==null)?0:m.run.k-base.run.k;
  if(dk) parts.push(dk<0?`reicht ${-dk} ${dk===-1?'Monat':'Monate'} kürzer`:`reicht ${dk} ${dk===1?'Monat':'Monate'} länger`);
  if(t==='f'){ if(Math.abs(m.need-base.need)>=1) parts.push(`Monatsziel ${eur(base.need)} → <b>${eur(m.need)}</b>`); }
  else if(o.kind==='out'&&o.cat!=='tax'){ const eff=o.amount-(o.cat==='biz'?rate*netOf(o.amount,o.vat):0); parts.push(`entspricht <b>${eur(eff/((1-rate)||1))}</b> Extra-Umsatz`); }
  return parts.join(' · ');
}

function bindPlan(){
  $$('[data-pnew]').forEach(b=>b.onclick=()=>b.dataset.pnew==='fix'?openFixed(null,'biz',true):openExtra(null,'out',true));

function gaugeSVG(pct){

  const pt=a=>[cx+R*Math.cos(a), cy-R*Math.sin(a)];
  const [x0,y0]=pt(a0), [x1,y1]=pt(a1), [xe,ye]=pt(0);
  const col=pct>1?'var(--red)':pct>0.9?'var(--amber)':'var(--sage)';
  return `<svg width="120" height="72" viewBox="0 0 120 72" role="img" aria-label="${Math.round(pct*100)} Prozent verplant">
    <path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${xe} ${ye}" fill="none" stroke="var(--line2)" stroke-width="14" stroke-linecap="round"/>
    ${p>0?`<path d="M${x0} ${y0} A${R} ${R} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}" fill="none" stroke="${col}" stroke-width="14" stroke-linecap="round"/>`:''}

}

function niceTicks(lo,hi,n=4){const span=hi-lo||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),st=[1,2,2.5,5,10].map(s=>s*mag).find(s=>s>=raw);const a=Math.floor(lo/st)*st,b=Math.ceil(hi/st)*st,t=[];for(let v=a;v<=b+1e-6;v+=st)t.push(Math.round(v));return t;}
const kfmt=v=>Math.abs(v)>=1000?(v/1000).toLocaleString('de-DE',{maximumFractionDigits:1})+'k':String(Math.round(v));
function goMonth(m){CUR=m;setTab('monate');render();window.scrollTo({top:0});}
function hover(el,tip,n,L,cw,W,html,onPick){

      const tw=tip.offsetWidth;let lx=el.offsetLeft+L+cw*i+cw/2-tw/2;lx=Math.max(6,Math.min(lx,el.parentElement.clientWidth-tw-6));tip.style.left=lx+'px';tip.style.top=(el.offsetTop-tip.offsetHeight+4)+'px';};
    h.addEventListener('pointerenter',show);h.addEventListener('pointermove',show);
    h.addEventListener('pointerleave',()=>{el.querySelector('.hl').setAttribute('opacity','0');tip.style.display='none';});
    h.addEventListener('click',()=>onPick(i));});
}
function lineChart(el,tip,rows,pol){

function barChart(el,tip,rows,getters,colors,tipHtml){

  const col=s=>s==='ok'?'var(--sage)':s==='eng'?'var(--amber)':'var(--red)';
  let s='';
  tk.forEach(v=>{s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="${v===0?1.6:1}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${kfmt(v)}</text>`;});
  s+=`<rect class="hl" y="${T}" height="${H-T-B}" width="${cw}" fill="var(--line)" opacity="0" rx="10"/>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y(pol)}" y2="${y(pol)}" stroke="var(--mute)" stroke-dasharray="5 4" stroke-width="1.4"/>`;
  const A=path(a);
  if(b){const Bp=path(b);
    s+=`<path d="${A.d}" fill="none" stroke="var(--gray)" stroke-width="2.4" stroke-linecap="round"/>`;
    s+=`<path d="${Bp.d}" fill="none" stroke="var(--sage)" stroke-width="2.6" stroke-linecap="round"/>`;
    b.forEach((r,i)=>{s+=`<circle cx="${Bp.P[i][0]}" cy="${Bp.P[i][1]}" r="5" fill="${col(r.status)}" stroke="var(--card)" stroke-width="2.5"/>`;});
  } else {
    s+=`<path d="${A.d}" fill="none" stroke="var(--gray)" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  const step=n>14?3:n>8&&W<520?2:1;
  a.forEach((r,i)=>{if(i%step===0) s+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle">${MN[mIdx(r.m)%12]}</text>`;});
  a.forEach((r,i)=>{s+=`<rect class="hit" data-i="${i}" x="${L+cw*i}" y="0" width="${cw}" height="${H}" fill="transparent" style="cursor:pointer"/>`;});
  el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kontostand mit und ohne Plan">${s}</svg>`;
  hover(el,tip,n,L,cw,W,i=>`${mLong(a[i].m)}<br>ohne Plan <b>${eur(a[i].end)}</b>${b?`<br>mit Plan <b>${eur(b[i].end)}</b>`:''}`,i=>goMonth(a[i].m));
}

/* ============ Sheets ============ */
const bd=$('#bd'), SHEET=$('#sheet'); let sh=SHEET;
function openSheet(title,html,onSave,saveLabel='Speichern'){
  sh=SHEET;
  sh.innerHTML=`<div class="sh"><h3>${title}</h3><button data-close>Schließen</button></div>${html}<button class="save" data-save>${saveLabel}</button>`;
  bd.classList.add('on'); sh.scrollTop=0; sh.querySelector('[data-close]').onclick=closeSheet;
  sh.querySelector('[data-save]').onclick=()=>{if(onSave()===false)return;closeSheet();};
}
function closeSheet(){bd.classList.remove('on');SHEET.innerHTML='';sh=SHEET;}
bd.onclick=e=>{if(e.target===bd)closeSheet();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&bd.classList.contains('on'))closeSheet();});
const v=id=>sh.querySelector('#'+id).value, n=id=>parseNum(sh.querySelector('#'+id).value), ck=id=>{const e=sh.querySelector('#'+id);return !!(e&&e.checked);};
const showEl=(id,on)=>{const e=sh.querySelector('#'+id);if(e)e.style.display=on?'':'none';};
function chips(id,opts,val){return `<div class="chips" id="${id}" data-val="${val}">${opts.map(([k,t])=>`<button type="button" data-v="${k}" class="${k===val?'on':''}">${t}</button>`).join('')}</div>`;}
function bindChips(cb){sh.querySelectorAll('.chips').forEach(c=>c.querySelectorAll('button').forEach(b=>b.onclick=()=>{c.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');c.dataset.val=b.dataset.v;cb&&cb();}));}
const chipVal=id=>sh.querySelector('#'+id).dataset.val;
const monthOpts=(sel,from,count)=>{let h='';const i0=mIdx(from);for(let k=0;k<count;k++){const m=mStr(i0+k);h+=`<option value="${m}" ${m===sel?'selected':''}>${mLong(m)}</option>`;}if(sel&&!h.includes(`"${sel}"`))h=`<option value="${sel}" selected>${mLong(sel)}</option>`+h;return h;};
const sw=(id,label,on,hint='')=>`<label class="sw" id="${id}Row"><span><span id="${id}Lbl">${label}</span>${hint?`<small>${hint}</small>`:''}</span><input type="checkbox" id="${id}" ${on?'checked':''}></label>`;
const delBtn=id=>id?'<button class="del" id="del">Löschen</button>':'';
const fmtIn=v=>v==null||v===''?'':String(v).replace('.',',');

/* Job oder Ausgabe in einem Monat */

  if(!x) return; const isIn=x.kind==='in', base=metrics();
  const title=id?(x.plan?'Durchspielen':isIn?'Job bearbeiten':'Ausgabe bearbeiten'):(plan?'Einmalige Ausgabe durchspielen':isIn?'Neuer Job':'Neue Ausgabe');
  openSheet(title,`
    ${isIn?'':`<div class="f"><label>Was für eine Ausgabe?</label>${chips('xCat',[['biz','Business'],['priv','Privat'],['invest','Anschaffung'],['tax','Steuer']],x.cat)}</div>`}
    <div class="f"><label for="xName">${isIn?'Kunde oder Projekt':'Wofür?'}</label><input type="text" id="xName" value="${esc(x.name)}" placeholder="${isIn?'z. B. Imagefilm für Bäckerei Krume':'z. B. Kameramiete'}"></div>

    ${sw('xPaid',isIn?'Ist schon bezahlt':'Ist schon erledigt',x.paid)}
    ${sw('xPlan','Nur durchspielen',!!x.plan,'Zählt erst mit, wenn du es fest machst')}
    <div class="calc" id="xCalc"></div>

  function build(strict){

    const cat=isIn?'job':chipVal('xCat'), pl=ck('xPlan');
    return {id:id||uid(),name:name||'Neu',amount:amt,kind:x.kind,cat,vat:vatOn&&(isIn||cat==='biz'||cat==='invest')?ck('xVat'):false,month:v('xMonth'),paid:pl?false:ck('xPaid'),plan:pl};
  }
  const upd=()=>{
    const cat=isIn?'job':chipVal('xCat'), a=n('xAmt'), canVat=vatOn&&(isIn||cat==='biz'||cat==='invest'), vat=canVat&&ck('xVat');
    showEl('xVatRow',canVat); showEl('xPaidRow',!ck('xPlan'));
    sh.querySelector('#xAmtL').textContent=isIn?(vatOn?'Betrag ohne MwSt':'Betrag'):'Betrag, der abgebucht wird';
    let h='';
    if(!a) h=isIn?'Trag den Betrag ein, den du in Rechnung stellst.':'Trag ein, was von deinem Konto abgeht.';
    else if(isIn){const m=vat?a*VAT:0,t=rate*a; h=`${vat?`Auf der Rechnung stehen <b>${eurX(a+m)}</b>. Die ${eurX(m)} MwSt gehören dem Finanzamt. `:''}${eurX(t)} gehen in die Steuerrücklage. <b>Für dich bleiben ${eurX(a-t)}.</b>`;}
    else if(cat==='priv') h=`Geht direkt von deinem Geld ab.`;
    else if(cat==='tax') h=`Wird aus deinem Steuertopf bezahlt. Reicht der nicht, kommt der Rest vom Konto.`;
    else {const net=vat?a/(1+VAT):a; h=cat==='biz'?`Senkt deinen Gewinn, dadurch ${eurX(rate*net)} weniger Steuerrücklage.`:'Anschaffungen werden über Jahre abgeschrieben. Das rechnet Geldfluss nicht ein, die Steuerersparnis ist dein Bonus.';}
    if(a&&cat!=='tax'){const o=build(false); o.plan=false; const after=tryWith(()=>{if(id) S.extras=S.extras.map(y=>y.id===id?o:y); else S.extras.push(o);}); h+=deltaHTML(base,after);}
    sh.querySelector('#xCalc').innerHTML=h;

  bindChips(upd); ['xAmt','xVat','xMonth','xPlan'].forEach(i=>{const e=sh.querySelector('#'+i);if(e){e.addEventListener('input',upd);e.addEventListener('change',upd);}}); upd();
  const d=sh.querySelector('#del'); if(d) d.onclick=()=>{S.extras=S.extras.filter(y=>y.id!==id);S.start.done=S.start.done.filter(k=>k!=='x:'+id);save();closeSheet();render();};
}

    <div class="f"><label for="fName">Name</label><input type="text" id="fName" value="${esc(f.name)}" placeholder="z. B. Retainer, Büromiete, Auto-Leasing"></div>

    <div class="f"><label for="fInt">Wie oft?</label><select id="fInt">${[[1,'Jeden Monat'],[3,'Alle 3 Monate'],[6,'Alle 6 Monate'],[12,'Einmal im Jahr']].map(([k,t])=>`<option value="${k}" ${+f.interval===k?'selected':''}>${t}</option>`).join('')}</select></div>
    <div class="two"><div class="f"><label for="fStart">Ab</label><select id="fStart">${monthOpts(f.start,mStr(mIdx(S.start.month)-3),40)}</select></div>
    <div class="f"><label for="fEnd">Bis</label><select id="fEnd"><option value="">Kein Ende</option>${monthOpts(f.end,S.start.month,60)}</select></div></div>
    ${sw('fPlan','Nur durchspielen',!!f.plan,'Zählt erst mit, wenn du es fest machst')}
    <div class="calc" id="fCalc"></div>
    ${delBtn(id)}`,()=>{
      const o=build(true); if(!o) return false;
      if(id) S.fixed=S.fixed.map(y=>y.id===id?o:y); else S.fixed.push(o); save(); render();
    });
  function build(strict){
    const name=v('fName').trim(), amt=n('fAmt'); if(strict&&(!name||!amt)){sh.querySelector(name?'#fAmt':'#fName').focus();return null;}
    const t=chipVal('fT');
    const o={id:id||uid(),name:name||'Neu',amount:amt,kind:t==='in'?'in':'out',cat:t==='priv'?'priv':'biz',vat:vatOn&&t!=='priv'?ck('fVat'):false,interval:+v('fInt'),start:v('fStart'),end:v('fEnd'),plan:ck('fPlan')};
    if(o.end&&mIdx(o.end)<mIdx(o.start)) o.end=o.start; return o;
  }
  const upd=()=>{
    const t=chipVal('fT'), a=n('fAmt'), canVat=vatOn&&t!=='priv', vat=canVat&&ck('fVat');
    showEl('fVatRow',canVat);
    const lab=sh.querySelector('#fVatLbl'); if(lab) lab.textContent=t==='in'?'Plus 19 % MwSt auf der Rechnung':'Enthält 19 % MwSt';
    sh.querySelector('#fAmtL').textContent=t==='in'?(vatOn?'Betrag ohne MwSt':'Betrag'):'Betrag, der abgebucht wird';

let toastT=null;

/* Kontostand */
function rKonto(main){
  const m=nowM(), st=S.start, same=st.month===m, rate=rateOf(), dispo0=+S.settings.dispo||0;
  // Offenes aus den Monaten seit dem letzten Eintrag
  const roll=[];
  if(st.month&&mIdx(st.month)<mIdx(m)){
    for(let i=mIdx(st.month);i<mIdx(m);i++){const mm=mStr(i);
      for(const f of S.fixed){if(f.plan||!isOn(f,mm))continue; const key=keyF(f,mm); if(S.paidFixed[key]||(mm===st.month&&st.done.includes(key)))continue; roll.push({t:'f',o:f,mm,key});}
      for(const x of S.extras){if(x.plan||x.paid||x.month!==mm)continue; if(mm===st.month&&st.done.includes(keyX(x)))continue; roll.push({t:'x',o:x,mm,key:keyX(x)});}
    }
  }
  const cur=[...fixedIn(m).map(f=>({t:'f',o:f,key:keyF(f,m),on:!!S.paidFixed[keyF(f,m)]})),...extrasIn(m).map(x=>({t:'x',o:x,key:keyX(x),on:!!x.paid}))]
    .sort((a,b)=>(a.o.kind==='in'?0:1)-(b.o.kind==='in'?0:1));
  const sgn=o=>o.kind==='in'?'+':'−', kindTxt=o=>o.kind==='in'?'Einnahme':o.cat==='priv'?'Privat':o.cat==='tax'?'Steuer':o.cat==='invest'?'Anschaffung':'Business';
  const expect=same?expectedNow():null, sal=salaryOf(m), salPaid0=same?st.salPaid:0;
  const rollFrom=roll.length?[...new Set(roll.map(r=>mName(r.mm)))].join(', '):'';
  openPage(main,`
    <div class="phead"><h2>Kontostand</h2><p>Trag ein, was gerade auf deinem Geschäftskonto steht, und hak ab, was diesen Monat schon gebucht ist. Dann zählt nichts doppelt.${same&&st.asOf?` Zuletzt eingetragen am ${fmtDate(st.asOf)}`:''}</p></div>
    <div class="pgrid2">
      <div class="pcol">
        <section class="card">
          <div class="chead"><h3>Was steht auf dem Konto?</h3></div>
          <div class="two">
            <div class="f"><label for="bMain">Geschäftskonto</label><div class="money"><input type="text" id="bMain" inputmode="decimal" value="${same?fmtIn(st.main??st.free):''}" placeholder="0"></div></div>
            <div class="f"><label for="bDispo">Dispo-Limit</label><div class="money"><input type="text" id="bDispo" inputmode="decimal" value="${dispo0?fmtIn(dispo0):''}" placeholder="0"></div></div>
          </div>
          <p class="hint">Genau wie in der Banking-App, auch im Minus. Ohne Steuer-Unterkonten und ohne Privatkonto.</p>
          ${same&&Math.abs(expect-st.free)>0.5?`<div class="calc" style="background:var(--sand-soft)">Laut deinen Haken seit dem ${fmtDate(st.asOf)} müssten jetzt etwa <b>${eurX(expect)}</b> drauf sein.</div>`:''}
          <div class="calc" id="bCalc" style="margin-bottom:0"></div>
        </section>
        <section class="card">
          <div class="chead"><h3>Steuer-Unterkonten</h3><span class="sub">optional</span></div>
          <p class="hint" style="margin:0 2px 12px">Fließt nicht in deinen Kontostand ein. Das Einkommensteuer-Konto ist dein Steuertopf: Steuerzahlungen gehen zuerst von dort.</p>
          <div class="two">
            <div class="f"><label for="bUst">Umsatzsteuer</label><div class="money"><input type="text" id="bUst" inputmode="decimal" value="${same?fmtIn(st.ust):''}" placeholder="0"></div></div>
            <div class="f"><label for="bEst">Einkommensteuer</label><div class="money"><input type="text" id="bEst" inputmode="decimal" value="${same?fmtIn(st.est):''}" placeholder="${!same&&st.est!=null?'zuletzt '+fmtIn(st.est):'0'}"></div></div>
          </div>
          <div class="calc" id="bTax" style="background:var(--sand-soft);margin-bottom:0"></div>
        </section>
      </div>
      <div class="pcol">
        ${roll.length?`<section class="card"><div class="chead"><h3>Noch offen aus ${rollFrom}</h3></div><p class="hint" style="margin:0 2px 12px">Kommt das noch? Dann wandert es in den ${mName(m)}. Feste Kosten sind meist längst abgebucht und stehen schon auf „erledigt".</p>${roll.map((r,i)=>`<div class="roll"><div class="top"><span><b>${esc(r.o.name)}</b> <small>${MN[mIdx(r.mm)%12]}</small></span><b class="num ${r.o.kind==='in'?'pos':''}">${sgn(r.o)}${eurX(+r.o.amount)}</b></div>${chips('rl'+i,[['come','Kommt noch'],['done','Ist erledigt']],r.t==='f'&&r.o.kind==='out'?'done':'come')}</div>`).join('')}</section>`:''}
        <section class="card">
          <div class="chead"><h3>Schon gebucht im ${mName(m)}?</h3></div>
          ${cur.map((r,i)=>`<label class="chk"><input type="checkbox" data-cur="${i}" ${r.on?'checked':''}><span>${esc(r.o.name)}<small>${kindTxt(r.o)}</small></span><b class="${r.o.kind==='in'?'pos':''}">${sgn(r.o)}${eurX(+r.o.amount)}</b></label>`).join('')||'<p class="hint">Für diesen Monat ist noch nichts eingetragen.</p>'}
          <p class="hint" style="margin-top:8px">Was du schon aufs Privatkonto überwiesen hast, etwa für Miete oder Krankenkasse, zählt als gebucht.</p>
          <div class="f" style="margin-top:16px"><label for="bSal">Gehalt, das im ${mName(m)} schon aufs Privatkonto ging</label><div class="money"><input type="text" id="bSal" inputmode="decimal" value="${salPaid0?fmtIn(salPaid0):''}" placeholder="0"></div></div>
          <p class="hint" style="margin-bottom:0">Eingeplant sind ${eur(sal)}. Der Rest wird noch abgezogen.</p>
        </section>
      </div>
    </div>`,()=>{
      if(v('bMain').trim()===''){const e=sh.querySelector('#bMain'); e.focus(); e.scrollIntoView({block:'center'}); return;}
      const main=n('bMain'), ust=v('bUst').trim()===''?null:n('bUst'), est=v('bEst').trim()===''?null:n('bEst');
      S.settings.dispo=Math.abs(n('bDispo'));
      roll.forEach((r,i)=>{const c=chipVal('rl'+i), o=r.o;
        if(r.t==='f'){S.paidFixed[r.key]=true; if(c==='come') S.extras.push({id:uid(),name:`${o.name} (${MN[mIdx(r.mm)%12]})`,amount:+o.amount,kind:o.kind,cat:o.kind==='in'?'job':o.cat,vat:!!o.vat,month:m,paid:false});}
        else if(c==='come') o.month=m; else o.paid=true;});
      sh.querySelectorAll('[data-cur]').forEach(cb=>{const r=cur[+cb.dataset.cur]; if(r.t==='f'){if(cb.checked)S.paidFixed[r.key]=true; else delete S.paidFixed[r.key];} else r.o.paid=cb.checked;});
      const done=[...fixedIn(m).filter(f=>S.paidFixed[keyF(f,m)]).map(f=>keyF(f,m)),...extrasIn(m).filter(x=>x.paid).map(keyX)];
      S.start={month:m,asOf:today(),main,free:main,ust,est,tax:est??0,done,orig:done.slice(),salPaid:Math.max(0,n('bSal'))};
      CUR=m; save(); setTab('monate'); render(); window.scrollTo({top:0}); toast('Kontostand übernommen');
    },'Übernehmen');
  const upd=()=>{
    const main=n('bMain'), d=Math.abs(n('bDispo'));
    sh.querySelector('#bCalc').innerHTML=`Damit rechnet Geldfluss: <b class="${main<0?'neg':''}">${eurX(main)}</b>`+
      (main<0?`<br><span style="color:var(--ink2)">Du bist im Dispo${d?`, Spielraum bis zum Limit: <b class="${d+main<0?'neg':''}">${eurX(d+main)}</b>`:''}.</span>`:d?`<br><span style="color:var(--ink2)">Mit Dispo hast du ${eurX(main+d)} Spielraum.</span>`:'');
    let net=0,vat=0; sh.querySelectorAll('[data-cur]').forEach(cb=>{const o=cur[+cb.dataset.cur].o; if(cb.checked&&o.kind==='in'){net+=+o.amount; vat+=S.settings.vatOn&&o.vat?o.amount*VAT:0;}});
    sh.querySelector('#bTax').innerHTML=net?`Für deine abgehakten Einnahmen im ${mName(m)} gehören <b>${eurX(vat)}</b> aufs Umsatzsteuer- und <b>${eurX(rate*net)}</b> aufs Einkommensteuer-Konto. Schon verschoben?`:'Hak rechts ab, was schon eingegangen ist, dann siehst du hier, was auf die Unterkonten gehört.';
  };
  bindChips();
  ['bMain','bDispo'].forEach(i=>sh.querySelector('#'+i).addEventListener('input',upd));
  sh.querySelectorAll('[data-cur]').forEach(cb=>cb.addEventListener('change',upd)); upd();
}

/* ============ Sync (eigene Vercel-Funktion + privater Blob-Speicher) ============ */
// Ohne config.js läuft Geldfluss wie bisher nur auf diesem Gerät.
const Sync=(()=>{
  const cfg=window.GELDFLUSS_CONFIG||{}, on=cfg.sync==='vercel';
  const META='geldfluss.sync', TOK='geldfluss.token';
  const labels={ok:'Synchron',saving:'Wird gespeichert …',offline:'Offline. Wird synchronisiert, sobald du wieder online bist.',error:'Sync hat nicht geklappt',conflict:'Zwei Versionen, bitte wählen',off:''};
  let token=null, status='off', timer=null, quiet=false, chain=Promise.resolve();
  try{token=localStorage.getItem(TOK);}catch(e){}
  const meta=()=>{try{return JSON.parse(localStorage.getItem(META))||{}}catch(e){return {}}};
  const setMeta=m=>{try{localStorage.setItem(META,JSON.stringify(Object.assign(meta(),m)))}catch(e){}};
  const q=fn=>(chain=chain.then(fn,fn));
  const when=at=>{try{return new Date(at).toLocaleString('de-DE',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
  const clean=()=>JSON.parse(JSON.stringify(S,(k,v)=>k==='_open'?undefined:v));
  function setStatus(s){status=s; document.querySelectorAll('.syncdot').forEach(d=>{d.className='syncdot '+s; d.title=labels[s]||'';});}
  const fail=e=>{if(e&&e.message==='auth') return; console.warn('Sync',e); setStatus(navigator.onLine===false?'offline':'error');};
  function dropToken(){token=null; try{localStorage.removeItem(TOK);}catch(e){}}

  async function api(method,path,body,ver){
    const h={'Content-Type':'application/json'}; if(token) h.Authorization='Bearer '+token; if(ver) h['x-geldfluss-version']=ver;
    const r=await fetch('/api/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'});
    let j={}; try{j=await r.json();}catch(e){}
    if(r.status===401&&path!=='login'){dropToken(); setStatus('off'); render(); throw new Error('auth');}
    return {status:r.status,body:j};
  }
  async function init(){
    if(!on) return;
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&token) pull();});
    window.addEventListener('online',()=>{if(token) pull();});
    window.addEventListener('focus',()=>{if(token) pull();});
    window.addEventListener('pageshow',()=>{if(token) pull();});
    window.addEventListener('offline',()=>{if(token) setStatus('offline');});
    setInterval(()=>{if(token&&document.visibilityState==='visible') pull();},60000); // auch bei offenem Fenster jede Minute abgleichen
    if(token) pull();
  }
  function apply(d,ver){
    quiet=true;
    try{S=importData(d); normalize(); applyTheme(S.settings.theme); save();}finally{quiet=false;}
    setMeta({remoteAt:ver,dirty:false});
  }
  async function doPull(){
    if(!token) return;
    try{
      const m=meta(), r=await api('GET','state',null,m.remoteAt), d=r.body;
      if(r.status!==200) throw new Error('status '+r.status);
      if(d.unchanged){ if(m.dirty) return doPush(); setStatus('ok'); return; }   // nichts Neues in der Cloud
      if(!d.data){ if(S.start.month) return doPush(); setStatus('ok'); return; }  // Cloud leer: Daten von hier hochladen
      if(d.version===m.remoteAt){ if(m.dirty) return doPush(); setStatus('ok'); return; }
      if(m.dirty&&S.start.month) return conflict(d);                              // hier und dort geändert
      apply(d.data,d.version); setStatus('ok'); if(!bd.classList.contains('on')&&TAB!=='konto'&&TAB!=='einstellungen') render();                            // anderes Gerät war neuer
    }catch(e){fail(e);}
  }
  async function doPush(){
    if(!token) return; setStatus('saving');
    try{
      const m=meta(), r=await api('PUT','state',{data:clean(),base:m.remoteAt||null});
      if(r.status===409) return conflict(r.body.current);
      if(r.status!==200) throw new Error('status '+r.status);
      setMeta({remoteAt:r.body.version,dirty:false}); setStatus('ok');
    }catch(e){fail(e);}
  }
  function conflict(r){
    setStatus('conflict');
    openSheet('Zwei Versionen',`
      <p class="lead" style="margin:0 2px 14px">Auf diesem Gerät gibt es Änderungen, die noch nicht in der Cloud sind. Gleichzeitig wurde in der Cloud${r.at?` am <b>${when(r.at)}</b>`:''} eine andere Version gespeichert, wahrscheinlich von deinem anderen Gerät.</p>
      <p class="hint">Welche willst du behalten? Die andere wird überschrieben. Wenn du unsicher bist: vorher unter Einstellungen ein Backup sichern.</p>
      <button type="button" class="ghost" id="keepLocal" style="width:100%;padding:14px;margin-bottom:8px">Die von diesem Gerät behalten</button>`,
      ()=>{apply(r.data,r.version); setStatus('ok'); render();},'Die aus der Cloud laden');
    sh.querySelector('#keepLocal').onclick=()=>{setMeta({remoteAt:r.version,dirty:true}); closeSheet(); push();};
  }
  const pull=()=>q(doPull), push=()=>q(doPush);
  function changed(){ if(quiet) return; setMeta({dirty:true}); if(on&&token){clearTimeout(timer); timer=setTimeout(push,800);} }
  async function login(pw){
    const r=await api('POST','login',{password:pw});
    if(r.status===503) throw new Error('not_configured');
    if(r.status!==200||!r.body.token) throw new Error('wrong');
    token=r.body.token; try{localStorage.setItem(TOK,token);}catch(e){}
    await pull();
  }
  function logout(){
    dropToken(); clearTimeout(timer);
    try{localStorage.removeItem(KEY); localStorage.removeItem(META);}catch(e){}
    S=blank(); normalize(); CUR=null; setStatus('off');
  }
  return {on:()=>on, needLogin:()=>on&&!token, init, login, logout, pull, push, changed, email:()=>'Angemeldet auf diesem Gerät', statusText:()=>labels[status]||''};
})();
SyncRef=Sync;

function rLogin(main){
  $('#hTitle').textContent='Geldfluss'; $('#hSub').textContent='Melde dich an, dann sind deine Zahlen auf allen Geräten gleich.';
  main.innerHTML=`<div class="card empty"><h3>Anmelden</h3><p>Mit deinem Geldfluss-Passwort. Das machst du auf jedem Gerät nur einmal.</p>
    <form id="lf" autocomplete="on">
      <input type="text" name="username" value="geldfluss" autocomplete="username" hidden>
      <div class="f"><label for="lP">Passwort</label><input type="password" id="lP" autocomplete="current-password"></div>
      <p class="hint" id="lErr" style="color:var(--red)"></p>
      <button class="save" type="submit" id="lBtn">Anmelden</button>
    </form></div>`;
  $('#lf').onsubmit=async e=>{
    e.preventDefault(); const b=$('#lBtn'); b.disabled=true; b.textContent='Einen Moment …'; $('#lErr').textContent='';
    try{await Sync.login($('#lP').value); render();}
    catch(err){
      $('#lErr').textContent=navigator.onLine===false?'Du bist offline. Für die erste Anmeldung brauchst du Internet.'
        :err.message==='not_configured'?'Auf dem Server ist noch kein Passwort hinterlegt.':'Das Passwort stimmt nicht.';
      b.disabled=false; b.textContent='Anmelden';
    }
  };
}

// Start
if(Sync.on()){ Sync.init().catch(()=>{}).finally(render); } else render();
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script>
